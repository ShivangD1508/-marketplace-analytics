name: marketplace_analytics
version: "1.0.0"
config-version: 2

profile: marketplace_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Where the nine raw Olist CSVs live, relative to this dbt project directory.
  # Point it at a real Kaggle download or at the output of
  # scripts/generate_sample_data.py -- the models do not care which.
  raw_data_dir: "../data/raw"

  # Sessionization rule. A buyer-initiated event more than this many minutes
  # after the previous one starts a new session. See README "Sessions".
  session_inactivity_minutes: 30

  # Incremental restatement window for int_events, in days, measured back from
  # the newest order *placement*. Sized empirically, and the sizing is a real
  # trade-off rather than a safe default -- measured on the published dataset:
  #
  #   window   orders whose lifecycle exceeds it   share of table reprocessed
  #     90d          338  (0.34%)                          9.6%
  #    190d           89  (0.09%)                         30.8%
  #    270d           33  (0.03%)                         49.7%
  #    550d            0  (0.00%)                         93.3%
  #
  # Olist's event stream has a 528-day tail, so a window wide enough to be
  # strictly correct reprocesses almost the whole table and incrementality buys
  # nothing. 270 days is the chosen point: every order but 33 completes inside
  # it, and those 33 are swept up by the weekly full refresh that the Dagster
  # DAG schedules. See README "Incrementality" for the query that re-measures
  # this and for why a source-side updated_at is the real fix.
  events_lookback_days: 270

models:
  marketplace_analytics:
    +materialized: view
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

tests:
  marketplace_analytics:
    +store_failures: true
    +schema: test_failures
